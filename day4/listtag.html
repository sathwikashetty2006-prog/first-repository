<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <ul type="square">
    <li>hello</li>
    <li>hii</li>
    <li>bye</li>
  </ul>
  <ol type="i">
    <li>apple</li>
    <li>mango</li>
    <li>orange</li>
  </ol>
  <!--nested list-->
  <ul>
    <li>fruits</li>
    <ul>
        <li>appl</li>
        <li>bannan</li>
    </ul>
    <li>vegetable</li>
    <ul>
        <li>tomato</li>
        <li>potato</li>
    </ul>
  </ul>
</body>
</html>
